services:
  jenkins:
    build: .
    image: catalog-jenkins:local
    container_name: catalog-jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      AWS_PROFILE: catalog-admin
      AWS_REGION: ap-south-2
      AWS_DEFAULT_REGION: ap-south-2
      AWS_SDK_LOAD_CONFIG: "1"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ${HOME}/.aws:/var/jenkins_home/.aws

volumes:
  jenkins_home: